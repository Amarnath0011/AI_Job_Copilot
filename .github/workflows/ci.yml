name: Project checks

on:
  push:
    branches:
      - feature/full-auth-user-ownership
      - fix/ats-scoring-reliability
  pull_request:
    branches:
      - local-baseline-2026-10-20
      - main
      - feature/full-auth-user-ownership

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install authentication test dependencies
        run: python -m pip install PyJWT==2.15.0 bcrypt==5.0.0 python-dotenv==1.2.2 SQLAlchemy==2.0.51 pytest
      - name: Compile backend Python files
        run: python -m compileall -q backend/app
      - name: Test password hashing and JWT validation
        working-directory: backend
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
